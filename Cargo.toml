[package]
name = "better-media-player"
version = "0.1.0"
edition = "2021"
description = "A fast Windows desktop player for audio and video"
license = "MIT"
repository = "https://github.com/tpwatson/better-windows-media-player"
publish = false

[[bin]]
name = "BetterMediaPlayer"
path = "src/main.rs"

[dependencies]
qrcode = { version = "0.14", default-features = false }
rodio = "=0.20.1"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Media_MediaFoundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.62"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
panic = "abort"
strip = true

[build-dependencies]
embed-resource = "3"
